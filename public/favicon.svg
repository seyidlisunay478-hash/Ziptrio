<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Inner Glow / Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="6" />

  <!-- Visual Editor Canvas Box Symbol -->
  <g filter="url(#shadow)">
    <!-- Top-level frame bar dots -->
    <circle cx="150" cy="140" r="10" fill="#ef4444" opacity="0.85" />
    <circle cx="180" cy="140" r="10" fill="#f59e0b" opacity="0.85" />
    <circle cx="210" cy="140" r="10" fill="#10b981" opacity="0.85" />

    <!-- Left Code Bracket < -->
    <path d="M 195 210 L 125 275 L 195 340" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Code Bracket > -->
    <path d="M 317 210 L 387 275 L 317 340" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Lightning Zipper / Fast Visual Spark -->
    <path d="M 276 190 L 222 282 L 264 282 L 236 360 L 300 262 L 258 262 Z" fill="url(#sparkGrad)" />

    <!-- Interactive Selection Node Badges -->
    <rect x="110" y="260" width="30" height="30" rx="6" fill="#38bdf8" />
    <rect x="372" y="260" width="30" height="30" rx="6" fill="#38bdf8" />

    <!-- Bottom Layer Indicator Pills -->
    <rect x="156" y="385" width="200" height="20" rx="10" fill="rgba(255, 255, 255, 0.25)" />
    <rect x="196" y="420" width="120" height="14" rx="7" fill="rgba(255, 255, 255, 0.15)" />
  </g>
</svg>
